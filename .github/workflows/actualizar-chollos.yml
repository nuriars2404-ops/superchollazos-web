name: Actualizar chollos

# Lee el canal de Telegram cada 10 minutos y publica la web en GitHub Pages.
# GitHub puede retrasar las ejecuciones programadas unos minutos en horas punta.
on:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: chollos
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/scrape_telegram.py --pages 15
      - name: Guardar chollos en el repositorio
        run: |
          git config user.name "chollos-bot"
          git config user.email "chollos-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Actualizar chollos"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
